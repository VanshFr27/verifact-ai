<!DOCTYPE html>
<html>
<head>
    <title>VeriFact AI</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #0f2027, #203a43, #000000);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .container {
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0,255,255,0.2);
            text-align: center;
            transition: 0.3s;
        }

        .container:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(0,255,255,0.4);
        }

        h1 {
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 0 0 15px cyan;
        }

        .tagline {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 90px;
            border-radius: 12px;
            border: none;
            outline: none;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            resize: none;
        }

        textarea::placeholder {
            color: #bbb;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border-radius: 12px;
            border: none;
            background: cyan;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 20px cyan;
            transform: scale(1.1);
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0,255,255,0.15);
            box-shadow: 0 0 15px cyan;
            font-size: 18px;
            font-weight: bold;
        }

        .loading {
            margin-top: 15px;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid cyan;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

    </style>
</head>

<body>

<div class="container">
    <h1>🧠 VeriFact AI</h1>
    <div class="tagline">Detect Truth Instantly</div>

    <form method="POST" id="form">
        <textarea id="news" name="news" placeholder="Ask anything..."></textarea>
        <br>
        <button type="submit">Analyze</button>
    </form>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    {% if prediction %}
        <div class="result" id="result">
            {{ prediction }}
        </div>
    {% endif %}
</div>

<script>
    const textarea = document.getElementById("news");
    const form = document.getElementById("form");
    const loading = document.getElementById("loading");

    textarea.addEventListener("keypress", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            loading.style.display = "block";
            form.submit();
        }
    });

    form.addEventListener("submit", function(){
        loading.style.display = "block";
    });

    setTimeout(() => {
        let result = document.getElementById("result");
        if (result) result.style.display = "none";
    }, 4000);
</script>

</body>
</html>
